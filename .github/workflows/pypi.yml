name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag"
        default: "latest"
      branch:
        description: "Source branch"
        default: "zyhu/reduce-wheel-size"
      build_os:
        description: "Select OS to build wheels for"
        required: true
        default: "Ubuntu"
        type: choice
        options:
          - Both
          - MacOS
          - Ubuntu

env:
  BUILD_TYPE: Release
  LINUX_ARCH: "x86_64"
  PYTHON_VERSIONS: "cp311-*"
  #PYTHON_VERSIONS: "cp39-* cp310-* cp311-* cp312-* cp313-*"
  DEV_LIBS_TO_EXCLUDE: |
    twine
    sphinx
    guzzle_sphinx_theme
    pre-commit
    clang-format
    cppcheck
    cpplint
    pylint
    sphinxcontrib-napoleon
    ninja
    setuptools
    cmake
    wheel

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
      version_no_v: ${{ steps.sanitize.outputs.no_v }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: check FILTERED
        run: |
          echo $FILTERED
          echo $DEV_LIBS
          echo $PYTHON_VERSIONS
          echo $LINUX_ARCH
          echo $BUILD_TYPE
          REQUIREMENTS=$(python -c "${FILTERED}")
          echo "Filtered requirements: $REQUIREMENTS"

      - name: Determine version tag
        id: determine_version
        run: |
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            git fetch --tags
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag (if not latest)
        if: ${{ inputs.version_tag != 'latest' }}
        run: |
          git checkout ${{ steps.determine_version.outputs.version }}

      - name: Strip leading “v”
        id: sanitize
        run: |
          raw=${{ steps.determine_version.outputs.version }}
          echo "version_no_v=${raw#v}" >> $GITHUB_OUTPUT

      - name: Filter dependencies
        id: filter
        run: |
          PATTERN=$(echo "$DEV_LIBS_TO_EXCLUDE" | paste -sd'|' -)
          FILTERED=$(grep -Ev "^(${PATTERN})" requirements.txt || true | xargs)
          echo "Filtered requirements: $FILTERED"
          echo "FILTERED=$FILTERED" >> $GITHUB_ENV

  build-macos:
    needs: prepare
    name: Build macOS wheels
    runs-on: macos-latest
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'MacOS' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            cibw_arch: "arm64"
          - os: macos-latest
            arch: x86_64
            cibw_arch: "x86_64"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Configure wheel build env
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.1" >> $GITHUB_ENV
          echo "ARCHFLAGS=-arch ${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          grep -Ev "^($DEV_LIBS)" requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: CMake configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=OFF

      - name: CMake build
        run: cmake --build build --parallel

      - name: Build macOS wheel
        env:
          CIBW_PLATFORM: macos
          CIBW_BUILD: ${{ env.PYTHON_VERSIONS }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel --exclude 'lib(c10|torch|shm|iomp).*\.dylib' -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD: |
            eval "$FILTERED" && pip install -r filtered.txt && \
            cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
                  -DCMAKE_CXX_FLAGS_RELEASE="-Os -s" \
                  -DBUILD_TESTS=OFF && \
            cmake --build build --parallel
        run: |
          export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
          export DYLD_FALLBACK_LIBRARY_PATH="$TORCH_LIB:$DYLD_FALLBACK_LIBRARY_PATH"
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-linux:
    needs: prepare
    name: Build Linux wheels
    runs-on: ubuntu-latest
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'Ubuntu' }}

    env:
      TORCH_LIB_CMD: >
        python -c "import torch; print(torch.__path__[0] + '/lib')"
      TORCH_CMAKE_PREFIX_CMD: >
        python -c "import torch.utils; print(torch.utils.cmake_prefix_path)"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Build Ubuntu wheel
        env:
          CIBW_PLATFORM: linux
          CIBW_BUILD: ${{ env.PYTHON_VERSIONS }}
          CIBW_ARCHS: ${{ env.LINUX_ARCH }}
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            LD_LIBRARY_PATH=$(${TORCH_LIB_CMD}) auditwheel repair \
              --exclude 'lib(c10|torch|gomp|shm).*\.so' \
              -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD: |
            pip install torch --extra-index-url https://download.pytorch.org/whl/cpu && \
            pip install ${{ needs.prepare.outputs.filtered }}
            export LD_LIBRARY_PATH="$(${TORCH_LIB_CMD}):$LD_LIBRARY_PATH" && \
            cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
                  -DPython3_EXECUTABLE=$(which python) \
                  -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX_PATH"
            cmake --build build --parallel
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Ubuntu wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-${{ matrix.python-version }}-${{ env.LINUX_ARCH }}}}
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publish to PyPI
    if: ${{ always() }}
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*

      - name: Merge wheels
        run: |
          mkdir dist
          find . -name '*.whl' -exec mv {} dist/ \;

      - name: Publish to PyPI
        if: ${{ needs.build-macos.result == 'success' && needs.build-linux.result == 'success' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
