name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "cleanup-release"

env:
  BUILD_TYPE: Release
  PYTHON_VERSION: "3.11"

jobs:
  linux-wheel:
    name: Build linux wheels
    runs-on: ubuntu-latest
    outputs:
      job-status: ${{ job.status }}

    strategy:
      matrix:
        py: ["311"]
        arch: ["x86_64"]
        libc: ["many"]
      fail-fast: true

    steps:
      - name: Install Python library
        run: |
          sudo apt install -y python3.11-dev
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            echo "Finding latest tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: ${{ inputs.version_tag }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag
        if: ${{ inputs.version_tag != 'latest' }}
        run: git checkout ${{ steps.determine_version.outputs.version }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: cp${{ matrix.py }}-${{ matrix.libc }}linux*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: "WORKSPACE=${{ github.workspace }}"

      - name: Archive the built wheels
        uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels
