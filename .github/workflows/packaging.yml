name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "cleanup-release"
      build_os:
        description: "Select OS to build wheels for"
        required: true
        default: "Both"
        type: choice
        options:
          - Both
          - MacOS
          - Ubuntu

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'MacOS' }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            target_arch: arm64
            cibw_arch: "arm64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          echo "Input version tag: '${{ inputs.version_tag }}'"
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Sanitize version
        run: |
          V="${{ steps.determine_version.outputs.version }}"
          echo "VERSION=${V#v}" >> $GITHUB_ENV

      - name: Configure wheel build env
        run: |
          PV=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "PY_VERSION=$PV" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.1" >> $GITHUB_ENV
          echo "ARCHFLAGS=-arch ${{ matrix.target_arch }}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          grep -Ev '^(twine|sphinx|pre-commit|clang-format|cppcheck|cpplint|pylint|ninja|setuptools|cmake)' requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: CMake configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target_arch }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=OFF

      - name: CMake build
        run: cmake --build build --parallel

      - name: Build macOS wheel
        env:
          CIBW_PLATFORM: macos
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ matrix.target_arch }}
          path: wheelhouse/*.whl

  build-ubuntu:
    name: Build Ubuntu wheels
    runs-on: ubuntu-latest
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'Ubuntu' }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            target_arch: x86_64
            cibw_arch: "x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          echo "Input version tag: '${{ inputs.version_tag }}'"
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Sanitize version
        run: |
          V="${{ steps.determine_version.outputs.version }}"
          echo "VERSION=${V#v}" >> $GITHUB_ENV

      - name: Configure wheel build env
        run: |
          PV=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "PY_VERSION=$PV" >> $GITHUB_ENV

      - name: Build Ubuntu wheel
        env:
          CIBW_PLATFORM: linux
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            PYTORCH_LIB=$(python -c "import torch; print(torch.__path__[0] + '/lib')")
            LD_LIBRARY_PATH=$PYTORCH_LIB auditwheel repair -w {dest_dir} {wheel}
        run: |
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Ubuntu wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-${{ matrix.python-version }}-${{ matrix.target_arch }}
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-macos
      - build-ubuntu
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*

      - name: Merge wheels
        run: |
          mkdir dist
          find . -name '*.whl' -exec mv {} dist/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   user: __token__
        #   password: ${{ secrets.PYPI_API_TOKEN }}
