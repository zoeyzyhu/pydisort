name: Packaging Tests
on:
  push:
    # Run on tags that look like releases
    tags:
      - v*
    # Run when main is pushed to
    branches:
      - cli/distribute

jobs:
  macos-wheel:
    name: Build ${{ matrix.arch }} macOS Wheels for py${{ matrix.py }}
    runs-on: macos-12
    outputs:
      job-status: ${{ job.status }}
    strategy:
      matrix:
        py: ["39", "310", "311"]
        arch: ["universal2"]
        deployment_target: ["11.0"]
        include:
          - py: "38"
            deployment_target: "10.15"
            arch: "x86_64"
          - py: "38"
            deployment_target: "10.15"
            arch: "arm64"
      fail-fast: true
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: cp${{ matrix.py }}-*
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      - name: Archive the built wheels
        uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  linux-wheel:
    name: Build linux wheels
    runs-on: ubuntu-latest
    outputs:
      job-status: ${{ job.status }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2

      - name: Archive the built wheels
        uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  publish-files-to-pypi:
    name: Publish distribution files to PyPI
    runs-on: ubuntu-22.04

    outputs:
      job-status: ${{ job.status }}

    needs:
      - "macos-wheel"
      - "linux-wheel"

    steps:
      - name: Download pre-built wheels
        uses: actions/download-artifact@v3
        with:
          path: dist/
          name: wheels
      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYDISORT_TOKEN }}
