name: Python Wheel Builder

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        required: true

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-22.04
            arch: [x86_64, aarch64]
          - os: macos-14
            arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python${{ matrix.python-version }}-dev \
            build-essential \
            cmake \
            ninja-build \
            libopenblas-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake ninja openblas

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build wheel
        env:
          CIBW_BUILD: cp${{ matrix.python-version.replace('.', '') }}*
          CIBW_ARCHS: ${{ matrix.arch }}
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --platform ${{ matrix.os == 'macos-14' && 'macos' || 'linux' }} --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  upload-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple-artifacts: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
