name: Python Wheel Builder

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        required: true
        default: "v0.10.3"
      branch:
        description: "Branch to build from"
        required: true
        default: "test-packaging"
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04
            arch: aarch64
          - os: macos-14
            arch: x86_64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libopenblas-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake ninja openblas

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
          -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
          -DBUILD_TESTS=ON

      - name: Build
        #run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        run: |
          cmake --build build --target install --config ${{ env.BUILD_TYPE }}

      - name: Install the project
        run: pip install .

      - name: Configure build environment
        run: |
          VERSION=${INPUT_VERSION_TAG#v}
          PY_VERSION=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PY_VERSION=$PY_VERSION" >> $GITHUB_ENV

      - name: Build wheel
        env:
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.VERSION }}"
          CIBW_BEFORE_BUILD: "pip install -r requirements.txt"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel --require-archs {delocate_archs}
            --lib-sdir .dylibs
            --lib-dir "$TORCH_LIB_PATH"
            -v {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} --plat {plat} {wheel}
        run: |
          # Get absolute path to Torch libraries
          echo "TORCH_LIB_PATH=$(python -c 'import torch; print(torch.__path__[0] + \"/lib\")')" >> $GITHUB_ENV

          # Add Torch lib path to dynamic linker path
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="$TORCH_LIB_PATH:$DYLD_LIBRARY_PATH"
          fi

          python -m pip install cibuildwheel
          PLATFORM=$([ "${{ matrix.os }}" = "macos-14" ] && echo "macos" || echo "linux")
          python -m cibuildwheel --platform $PLATFORM --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  upload-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple-artifacts: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
