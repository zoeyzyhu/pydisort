name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "cleanup-release"

env:
  BUILD_TYPE: Release
  PYTHON_VERSION: "3.11"

jobs:
  linux-wheel:
    name: Build linux wheels
    runs-on: ubuntu-latest
    outputs:
      job-status: ${{ job.status }}

    strategy:
      matrix:
        py: ["311"]
        arch: ["x86_64"]
        libc: ["many"]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            echo "Finding latest tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: ${{ inputs.version_tag }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag
        if: ${{ inputs.version_tag != 'latest' }}
        run: git checkout ${{ steps.determine_version.outputs.version }}

      - name: Set sanitized version
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          grep -Ev '^(twine|sphinx|clang-format|cppcheck|cpplint)' requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: Configure CMake (host build, for tests or other purposes)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=ON

      - name: Build (host build)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: cp${{ matrix.py }}-${{ matrix.libc }}linux*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: "WORKSPACE=${{ github.workspace }} CMAKE_PREFIX_PATH=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"

      - name: Archive the built wheels
        uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels
