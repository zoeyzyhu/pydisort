name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "cleanup-release"

env:
  BUILD_TYPE: Release

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} - ${{ matrix.target_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.11]
        include:
          #- os: macos-latest
          #  target_arch: arm64
          #  cibw_arch: "arm64"
          - os: ubuntu-latest
            target_arch: x86_64
            cibw_arch: "x86_64"

    steps:
      # === 0. Checkout code and set up sanitized version ===
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          echo "Input version tag: '${{ inputs.version_tag }}'"
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            echo "No specific version provided, determining latest tag..."
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
            echo "Determined tag is ${LATEST_TAG}"
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: ${{ inputs.version_tag }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag if not 'latest'
        if: ${{ inputs.version_tag != 'latest' }}
        run: |
          echo "Checking out tag: ${{ steps.determine_version.outputs.version }}"
          git checkout ${{ steps.determine_version.outputs.version }}

      - name: Set sanitized version
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          SANITIZED_VERSION="${VERSION#v}"
          echo "Sanitized version: ${SANITIZED_VERSION}"
          echo "VERSION=${SANITIZED_VERSION}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # === 1. For MacOS, we build in the runner for cibuildwheel ===
      - name: Install Python dependencies
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          grep -Ev '^(twine|sphinx|clang-format|cppcheck|cpplint)' requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: Configure CMake (host build)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target_arch }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=ON

      - name: Build (host build)
        if: ${{ matrix.os == 'macos-latest' }}
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Configure wheel build environment
        run: |
          PY_VERSION=$(echo "${{ matrix.python_version }}" | tr -d '.')
          echo "Setting up Python $PY_VERSION for cibuildwheel"
          echo "PY_VERSION=$PY_VERSION" >> $GITHUB_ENV
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.1" >> $GITHUB_ENV
            echo "ARCHFLAGS=-arch ${{ matrix.target_arch }}" >> $GITHUB_ENV
          fi

      - name: Build wheel MacOS
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          CIBW_PLATFORM: macos
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
        run: |
          export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
          export DYLD_FALLBACK_LIBRARY_PATH="$TORCH_LIB:$DYLD_FALLBACK_LIBRARY_PATH"
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      # === 2. Build wheels using cibuildwheel containers ===
      - name: Build wheel Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CIBW_PLATFORM: linux
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            PYTORCH_LIB=$(python -c "import torch, os; print(os.path.join(torch.__path__[0], 'lib'))") &&
            echo "Using LD_LIBRARY_PATH=$PYTORCH_LIB" &&
            LD_LIBRARY_PATH=$PYTORCH_LIB auditwheel repair -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD: |
            pip install torch --extra-index-url https://download.pytorch.org/whl/cpu && \
            python -c "import re; open('filtered.txt','w').writelines([l for l in open('requirements.txt') if not re.match(r'^(twine|sphinx|clang-format|cppcheck|cpplint|torch)', l)])" && \
            pip install -r filtered.txt && \
            TORCH_LIB=$(python -c "import torch; print(torch.__path__[0] + '/lib')") && \
            TORCH_CMAKE_PREFIX_PATH=$(python -c "import torch.utils; print(torch.utils.cmake_prefix_path)") && \
            export LD_LIBRARY_PATH="$TORCH_LIB:$LD_LIBRARY_PATH" && \
            cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
                  -DPython3_EXECUTABLE=$(which python) \
                  -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX_PATH" \
                  -DBUILD_TESTS=ON && \
            cmake --build build --parallel
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      # === 3. Upload wheels ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.target_arch }}
          path: ./wheelhouse/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist

      - name: Merge wheel artifacts
        run: |
          find dist -name '*.whl' -exec mv {} dist/ \;
          rm -rf dist/*/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
