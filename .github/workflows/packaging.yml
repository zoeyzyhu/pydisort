name: Packaging Tests
on:
  push:
    # Run on tags that look like releases
    tags:
      - v*
  workflow_dispatch:
    inputs:
      incoming_ref:
        description: 'The ref to checkout before running the workflow'
        required: true
        default: 'main'
      upload_to_pypi:
        description: 'Whether to upload to PyPI'
        required: true
        default: 'false'

env:
  BUILD_TYPE: Release

jobs:
  macos-arm-wheel:
    name: Build macOS wheels
    runs-on: macos-latest
    outputs:
      job-status: ${{ job.status }}

    strategy:
      matrix:
        py: ["38", "39", "310", "311", "312"]
        deployment_target: ["11.0"]
      fail-fast: true
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Convert Python version string
        run: |
          PYTHON_VERSION=${{ matrix.py }}
          FORMATTED_VERSION="${PYTHON_VERSION:0:1}.${PYTHON_VERSION:1}"
          echo "PYTHON_VERSION=$FORMATTED_VERSION" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install python modules
        run: pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Set Library Paths
        run: |
          echo "LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> $GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          # uncomment this to enable passing environment variables
          #CIBW_ENVIRONMENT: "CMAKE_ARGS=-DPYTHON_VERSION=3.${{ matrix.py }}"
          # cross compilation with arm64 does not work
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD: cp${{ matrix.py }}-*

      - name: Archive the built wheels
        uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  macos-x86-wheel:
    name: Build macOS wheels
    runs-on: macos-13
    outputs:
      job-status: ${{ job.status }}

    strategy:
      matrix:
        py: ["38", "39", "310", "311", "312"]
        deployment_target: ["11.0"]
      fail-fast: true
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Convert Python version string
        run: |
          PYTHON_VERSION=${{ matrix.py }}
          FORMATTED_VERSION="${PYTHON_VERSION:0:1}.${PYTHON_VERSION:1}"
          echo "PYTHON_VERSION=$FORMATTED_VERSION" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install python modules
        run: pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Set Library Paths
        run: |
          echo "LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> $GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          # uncomment this to enable passing environment variables
          #CIBW_ENVIRONMENT: "CMAKE_ARGS=-DPYTHON_VERSION=3.${{ matrix.py }}"
          # cross compilation with arm64 does not work
          CIBW_ARCHS_MACOS: x86_64
          CIBW_BUILD: cp${{ matrix.py }}-*

      - name: Archive the built wheels
        uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  linux-wheel:
    name: Build linux wheels
    runs-on: ubuntu-latest
    outputs:
      job-status: ${{ job.status }}

    strategy:
      matrix:
        py: ["38", "39", "310", "311", "312"]
        arch: ["x86_64"]
        libc: ["many"]
      fail-fast: true

    steps:
      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache
          df -h

      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Convert Python version string
        run: |
          PYTHON_VERSION=${{ matrix.py }}
          FORMATTED_VERSION="${PYTHON_VERSION:0:1}.${PYTHON_VERSION:1}"
          echo "PYTHON_VERSION=$FORMATTED_VERSION" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install python modules
        run: pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Set Library Paths
        run: |
          echo "LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> $GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          # uncomment this to enable passing environment variables
          #CIBW_ENVIRONMENT: "CMAKE_ARGS=-DPYTHON_VERSION=3.${{ matrix.py }}"
          CIBW_BUILD: cp${{ matrix.py }}-${{ matrix.libc }}linux*
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Archive the built wheels
        uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  publish-files-to-pypi:
    name: Publish distribution files to PyPI
    runs-on: ubuntu-22.04

    outputs:
      job-status: ${{ job.status }}

    needs:
      - "macos-arm-wheel"
      - "macos-x86-wheel"
      - "linux-wheel"

    steps:
      - name: Download pre-built wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          name: wheels
      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYDISORT_TOKEN }}
