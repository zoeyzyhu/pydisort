name: Packaging Tests
on:
  push:
    # Run on tags that look like releases
    tags:
      - v*
    # Run when main is pushed to
    branches:
      - cli/distribute

jobs:
  macos-wheel-x86:
    name: Build X86 macOS Wheels
    runs-on: macos-12
    outputs:
      job-status: ${{ job.status }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_ARCHS_MACOS: "x86_64"

      - name: Archive the built wheels
        uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  linux-wheel:
    name: Build linux wheels
    runs-on: ubuntu-latest
    outputs:
      job-status: ${{ job.status }}

    steps:
      - uses: actions/checkout@v3
        name: Checkout the repository
        with:
          ref: ${{ github.event.inputs.incoming_ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2

      - name: Archive the built wheels
        uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
          name: wheels

  publish-files-to-pypi:
    name: Publish distribution files to PyPI
    runs-on: ubuntu-22.04

    outputs:
      job-status: ${{ job.status }}

    needs:
      #- "macos-wheel-arm"
      - "macos-wheel-x86"
      - "linux-wheel"

    steps:
      - name: Download pre-built wheels
        uses: actions/download-artifact@v3
        with:
          path: dist/
          name: wheels
      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYDISORT_TOKEN }}
