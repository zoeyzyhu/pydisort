name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "cleanup-release"

env:
  BUILD_TYPE: Release
  PYTHON_VERSION: "3.11"

jobs:
  build-wheels:
    name: Build wheels (macOS ${{ matrix.target_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        #os: [ubuntu-latest, macos-latest]
        #python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
            target_arch: arm64
            cibw_arch: "arm64"
          - os: macos-13
            python-version: "3.11"
            target_arch: x86_64
            cibw_arch: "x86_64"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Determine version tag
        id: determine_version
        run: |
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            echo "Finding latest tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: ${{ inputs.version_tag }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag
        if: ${{ inputs.version_tag != 'latest' }}
        run: git checkout ${{ steps.determine_version.outputs.version }}

      - name: Set sanitized version
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install python dependencies
        run: |
          grep -Ev '^(twine|sphinx|clang-format|cppcheck|cpplint)' requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/build
            ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.target_arch }}-build-${{ hashFiles('**/CMakeLists.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.target_arch }}-build-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target_arch }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Configure wheel build environment
        run: |
          VERSION="${{ github.event.inputs.version_tag }}"
          VERSION="${VERSION#v}"  # Strip the leading 'v'
          PY_VERSION=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PY_VERSION=$PY_VERSION" >> $GITHUB_ENV

      - name: Build wheel
        env:
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          MACOSX_DEPLOYMENT_TARGET: 11.1
          CIBW_ENVIRONMENT: "ARCHFLAGS='-arch ${{ matrix.target_arch }}'"
        run: |
          export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
          export DYLD_FALLBACK_LIBRARY_PATH="$TORCH_LIB:$DYLD_FALLBACK_LIBRARY_PATH"
          python -m pip install cibuildwheel
          PLATFORM=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          python -m cibuildwheel --platform $PLATFORM --output-dir wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.target_arch }}
          path: ./wheelhouse/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist

      - name: Merge wheel artifacts
        run: |
          find dist -name '*.whl' -exec mv {} dist/ \;
          rm -rf dist/*/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
