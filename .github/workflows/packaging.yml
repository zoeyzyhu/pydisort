name: Python Package Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        default: "latest"
      branch:
        description: "Source branch for the release"
        default: "main"

env:
  BUILD_TYPE: Release
  PYTHON_VERSION: "3.11" # Align with CI version

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ubuntu-latest, macos-latest]
        os: [macos-latest]
        #python-version: ["3.9", "3.10", "3.11", "3.12"]
        python-version: ["3.11"]
        include:
          #- os: ubuntu-latest
          #  arch: x86_64
          - os: macos-latest
            arch: arm64
          #- os: macos-latest
          #  arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0 # Needed for proper tag checkout

      - name: Determine version tag
        id: determine_version
        run: |
          if [[ "${{ inputs.version_tag }}" == "latest" ]]; then
            echo "Finding latest tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
            echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: ${{ inputs.version_tag }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag
        if: ${{ inputs.version_tag }} != 'latest'
        run: git checkout ${{ inputs.version_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install python dependencies
        run: |
          grep -Ev '^(twine|sphinx|clang-format|cppcheck|cpplint)' requirements.txt > filtered.txt
          pip install -r filtered.txt

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/build
            ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-build-${{ hashFiles('**/CMakeLists.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-build-
            ${{ runner.os }}-${{ matrix.python-version }}-
            ${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DBUILD_TESTS=ON

      - name: Build project
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.version_tag }}"
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --platform ${{ runner.os }} \
            --output-dir wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist

      - name: Merge wheel artifacts
        run: |
          find dist -name '*.whl' -exec mv {} dist/ \;
          rm -rf dist/*/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist
          verbose: true
          verify_metadata: true
