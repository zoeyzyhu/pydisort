---
repos:
  ## 1. Global check =========================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$
      - id: end-of-file-fixer
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.0
    hooks:
      - id: prettier
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$

  # It looks for a set of common misspellings
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$

  ## 2. Per language check ===================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: requirements-txt-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-shebang-scripts-are-executable

  ## Python related ----------------------------------------------------------

  - repo: local
    hooks:
      - id: pydocstyle
        name: pydocstyle
        entry: pydocstyle
        language: python
        types: [python]

  # Formats Python code to conform to the PEP 8 style guide
  - repo: https://github.com/pre-commit/mirrors-autopep8
    rev: v2.0.0
    hooks:
      - id: autopep8

  ## C/C++ related -----------------------------------------------------------

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [--style=Google, -i, --no-diff]
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$
      - id: cppcheck
        args: [--check-config]
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$

  - repo: local
    hooks:
      - id: cmake-format
        name: Fix *.cmake
        entry: cmake-format
        language: system
        files: .*\.cmake$
        args: ["-i"]

  ## 3. Lints ================================================================

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cpplint
        args: [
            "--filter=-legal/copyright,
            -build/include_subdir,
            -runtime/references",
          ]
        exclude: ^(src/cdisort/.*|tests/cdisort/.*)$

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        require_serial: true
