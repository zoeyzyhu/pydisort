repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        files: ^(src|python)/.*\.(c|cc|cpp|h|hpp)$
        exclude: ^src/cdisort
        args: ["-i", "-style=Google"]

      - id: cmake-format
        name: cmake-format
        entry: cmake-format
        language: system
        files: .*\.cmake$
        args: ["-i"]

      - id: black
        name: black
        entry: black
        language: system
        files: ^(tests/python)/.*\.(py)$
