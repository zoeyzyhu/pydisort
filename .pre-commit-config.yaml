---
repos:
    ## Global check ==========================================================
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.0.1
      hooks:
          - id: trailing-whitespace
            exclude: ^src/cdisort | *.c
          - id: end-of-file-fixer
            exclude: ^src/cdisort | *.c

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.0.0-alpha.0
      hooks:
          - id: prettier
            exclude: ^src/cdisort | *.c

    # It looks for a set of common misspellings
    - repo: https://github.com/codespell-project/codespell
      rev: v2.2.4
      hooks:
          - id: codespell
            exclude: ^src/cdisort | *.c

    ## Per language check ====================================================

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.0.1
      hooks:
          - id: requirements-txt-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-shebang-scripts-are-executable

    ## Python related --------------------------------------------------------
    # Black is a PEP 8 compliant opinionated formatter
    - repo: local
      hooks:
          # - id: black
          #   name: Fix *.py
          #   entry: black
          #   language: system
          #   files: ^(tests/python)/.*\.(py)$

          - id: pydocstyle
            name: pydocstyle
            entry: pydocstyle
            language: python
            types: [python]

    # Formats Python code to conform to the PEP 8 style guide
    - repo: https://github.com/pre-commit/mirrors-autopep8
      rev: v2.0.0
      hooks:
          - id: autopep8

    ## C/C++ related ---------------------------------------------------------
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v16.0.0
      hooks:
          - id: clang-format
            exclude: ^src/cdisort | *.c

    - repo: https://github.com/pocc/pre-commit-hooks
      rev: v1.3.5
      hooks:
          - id: clang-format
            args: [--style=Google]
            exclude: ^src/cdisort | *.c
          - id: uncrustify
            exclude: ^src/cdisort | *.c
          - id: cppcheck
            exclude: ^src/cdisort | *.c

    - repo: local
      hooks:
          # - id: clang-format
          #   name: Fix *.c,*.cc,*.cpp,*.h,*.hpp
          #   entry: clang-format
          #   language: system
          #   files: ^(src|python)/.*\.(c|cc|cpp|h|hpp)$
          #   exclude: ^src/cdisort | *.c
          #   args: ["-i", "-style=Google"]

          - id: cmake-format
            name: Fix *.cmake
            entry: cmake-format
            language: system
            files: .*\.cmake$
            args: ["-i"]

    ## Lints =================================================================

    - repo: https://github.com/pocc/pre-commit-hooks
      rev: v1.3.5
      hooks:
          - id: cpplint
            exclude: ^src/cdisort | *.c

    - repo: local
      hooks:
          - id: yamllint
            name: yamllint
            description: This hook runs yamllint.
            entry: yamllint
            language: python
            types: [file, yaml]

          - id: pylint
            name: pylint
            entry: pylint
            language: python
            types: [python]
            require_serial: true
